
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>My Task Manager</h1>
        <p class="subtitle">Organize your day, one task at a time.</p>

        <form id="task-form">
            <input
                type="text"
                id="task-input"
                placeholder="Enter a new task..."
                maxlength="200"
                aria-label="New task"
            >
            <button type="submit">Add Task</button>
        </form>

        <p id="error-message" role="alert"></p>

        <div class="task-info">
            <span id="task-count">Pending tasks: 0</span>
        </div>

        <div class="filters">
            <button class="filter active" data-filter="all">All</button>
            <button class="filter" data-filter="pending">Pending</button>
            <button class="filter" data-filter="completed">Completed</button>
        </div>

        <ul id="task-list"></ul>
        <p id="empty-message">No tasks yet. Add your first task!</p>
    </div>
</body>
</html>
